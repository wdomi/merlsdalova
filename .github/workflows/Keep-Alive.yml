name: Supabase New-Keep-Alive

on:
  schedule:
    # Runs at 09:00 UTC every 3 days
    - cron: '0 9 */3 * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  insert-record:
    runs-on: ubuntu-latest
    steps:
      - name: Insert record into temp table
        run: |
          # Replace 'your_column' with an actual column name if your table requires at least one non-auto field.
          # If the table truly has no required fields other than auto-generated ones, you can send an empty JSON object {}.
          # Using a dummy value for demonstration; adjust 'some_column' to match your table schema if needed.
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/temp" \
            -X POST \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}')
          
          echo "Supabase responded with HTTP $response"
          if [ "$response" -ge 400 ]; then
            echo "Unexpected response code, failing job so you get notified."
            exit 1
          fi
